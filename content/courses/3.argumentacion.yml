name: 
  es: Argumentación
  en: Argumentation
level: pregrado
description: "Argumentación para primeros semestres de ciencias humanas. Se divide en tres partes: lógica, retórica y pragmática. Incluye también el estudio de falacias comunes y cómo evitarlas. El curso hace énfasis en la argumentación como una actividad cooperativa para entablar acuerdos."