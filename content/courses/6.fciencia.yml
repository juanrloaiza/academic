name: 
  es: Filosofía de las Ciencias
  en: Philosophy of Science
level: pregrado
description: "Introducción a la filosofía de las ciencias. Comienza discutiendo cuatro problemas de la relación entre hechos y teorías: el problema de la confirmación, la inducción, la falsación y la subdeterminación empírica. Discutimos luego dos modelos de explicación (nomológico-deductivo y mecanicista), y finalizamos con un breve recorrido por las discusiones en historiografía de la ciencia de Kuhn, Lakatos y Feyerabend."
