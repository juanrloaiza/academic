name: 
  es: "Seminario: Emociones básicas y clases naturales"
  en: "Seminario: Basic emotions and natural kinds"
level: phd
description: "Seminario enfocado en la discusión sobre el estatus ontológico de las emociones como clases naturales y su relación con las teorías de las emociones básicas. Discute críticas filosóficas y empíricas a las teorías de las emociones básicas, así como alternativas como el construccionismo psicológico, el funcionalismo y el enactivismo."