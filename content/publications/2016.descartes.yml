title: "¿Cómo construir cuerpos en el universo cartesiano?"
authors: Cardona Suárez, C. A. and Loaiza, J. R.
year: 2016
openaccess: true
journal: Anales del Seminario de Historia de la Filosofía
volume: 33
issue: 2
pages: 489-515
doi: 10.5209/ASHF.53594
url: https://revistas.ucm.es/index.php/ASHF/article/view/53594
pdf: Cardona_Loaiza_2016.pdf
pubType: article
abstract: "En el presente artículo se muestra que en la cosmología cartesiana no resulta claro cómo se puede hablar o referir a cuerpos individuales en el marco de un universo absolutamente compacto. Se defiende que el concepto de cuerpo individual en el interior de dicha cosmología se puede construir como una ficción del espíritu. Un cuerpo individual se puede construir como la extensión que se encuentra encerrada en una superficie maximal cuyas subdivisiones carecen de movimiento relativo entre sí. Se muestra, también, que la cosmología cartesiana puede presentarse como un modelo trivial de la Teoría M."