title: "Non-Human Animal Emotions: Homological or Functional Kinds?"
authors: Loaiza, J. R.
pubType: article
year: 2022
openaccess: true
doi: 10.51359/2357-9986.2022.256754
url: https://periodicos.ufpe.br/revistas/perspectivafilosofica/article/view/256754/42986
journal: Perspectiva Filosófica
volume: 49
issue: 5
pages: 52-75
abstract: "In our daily lives, we attribute emotions to non-human animals. However,the ontological commitments this implies are still in discussion. Particularly,philosophers still debate whether considerations about the mechanisms un-derlying emotions are necessary or not to attribute emotions to non-humananimals. Here, I argue that such considerations are not sufficient, and that afunctionalist perspective is more fruitful than its main contender, the homo-logy thinking view. To do this, I consider findings from experimental psy-chology on emotion attribution to non-human animals and distinguish twoquestions concerning such emotions. I then discuss functionalism and ho-mology thinking, claiming that homology thinking precludes promising em-pirical hypotheses from the outset, resulting in a more limited position thanfunctionalism. Hence, functionalism inherits many benefits of homology thinking while providing more productive grounds."