title: "Controversias en torno a los conceptos cotidianos y conceptos científicos de emoción "
authors: Loaiza, J. R.
year: 2022
openaccess: true
url: https://revistas.unal.edu.co/index.php/idval/article/view/103859
journal: Ideas y Valores
volume: 71
issue: Sup. 8
pages: 192-217
doi: 10.15446/ideasyvalores.v71n8Supl.103859
pubType: article
abstract: "Sostengo que la controversia entre la teoría de las emociones básicas y el construccionismo psicológico yace en diferencias sobre el rol de los conceptos cotidianos de emoción en el ámbito científico. Para esto, analizo las discusiones en torno a la universalidad de las expresiones faciales y a la existencia de correspondencias neurofisiológicas para cada emoción. Muestro que en ambas discusiones estamos en un espacio de subdeterminación empírica, lo que impide saldar la controversia aludiendo a resultados experimentales. Finalizo con algunas sugerencias sobre cómo podría saldarse la controversia."