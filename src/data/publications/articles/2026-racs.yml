title: "Vicios de superioridad y desconfianza en la ciencia: el caso del cambio climático"
authors: Loaiza, J. R.
year: 2026
journal: "Revista Austral de Ciencias Sociales"
pubType: article
abstract: "¿Cómo se explica la desconfianza en la ciencia en casos en los que hay consenso científico? En este artículo sostengo que atender a nuestras actitudes sobre el conocimiento y los vicios de superioridad intelectual puede ofrecer dimensiones de análisis novedosas más allá de entender la desconfianza en la ciencia como un caso de ignorancia. Para mostrar esto, analizo el caso de la desconfianza en el cambio climático antropogénico, y sostengo que parte de la evidencia puede interpretarse como evidencia de vicios de superioridad que juegan un papel en la falta de aceptación del consenso científico. Concluyo que la educación y la comunicación científica deben entonces enfocarse no solo en transmitir información, sino también en fomentar actitudes colaborativas y virtudes intelectuales para abordar la desconfianza hacia la ciencia y promover una mayor aceptación del consenso científico."
url: http://revistas.uach.cl/index.php/racs/article/view/8237
issue: 50
pages: 39-56
